ptz:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: xmeye
    direction:
      required: true
      example: left
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - up_left
            - up_right
            - down_left
            - down_right
            - zoom_in
            - zoom_out
            - focus_near
            - focus_far
            - iris_open
            - iris_close
    channel:
      default: 0
      selector:
        number:
          min: 0
          max: 63
          mode: box
    speed:
      default: 5
      selector:
        number:
          min: 1
          max: 8
          mode: slider
    duration:
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: slider
    preset:
      selector:
        number:
          min: 0
          max: 255
          mode: box

search_recordings:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: xmeye
    channel:
      default: 0
      selector:
        number:
          min: 0
          max: 63
          mode: box
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    event:
      default: "*"
      selector:
        select:
          options:
            - "*"
            - "M"
            - "A"
            - "R"
            - "H"

download_recording:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: xmeye
    filename:
      required: true
      example: /idea0/2026-08-08/001/15.46.44-16.11.35[R][@b78][0].h264
      selector:
        text:
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    channel:
      default: 0
      selector:
        number:
          min: 0
          max: 63
          mode: box

get_config:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: xmeye
    section:
      required: true
      example: NetWork.NetCommon
      selector:
        text:

set_config:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: xmeye
    section:
      required: true
      example: General.Location
      selector:
        text:
    value:
      required: true
      selector:
        object:

