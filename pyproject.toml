[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmeye"
version = "0.3.0"
description = "Async client for the Xiongmai DVRIP (Sofia) protocol used by XMeye recorders"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "shnal" }]
keywords = ["xmeye", "xiongmai", "dvrip", "sofia", "nvr", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Moxnatiy/hass-xmeye"
Issues = "https://github.com/Moxnatiy/hass-xmeye/issues"
Funding = "https://ko-fi.com/shnal"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

# The default suite runs offline against a fake device; the live suite has its
# own configuration in tests_ha/pytest.ini because it needs the network.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# try/except/pass on a teardown path stays literal: contextlib.suppress reads
# no better there and costs a context manager on paths that run per frame.
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# The vendored copy is generated by tools/sync_lib.py; lint the source instead.
"custom_components/xmeye/xmeyelib/*" = ["ALL"]
